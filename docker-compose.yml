services:
  falkordb:
    image: falkordb/falkordb:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:3000:3000"
    volumes:
      - graph-data:/var/lib/falkordb/data
    environment:
      REDIS_ARGS: --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 3s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      IMPORT_MAX_RECORDS: ${IMPORT_MAX_RECORDS:-1000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5))['graph']=='connected'"]
      interval: 30s
      timeout: 8s
      retries: 3
    depends_on:
      falkordb:
        condition: service_healthy
volumes:
  graph-data:
